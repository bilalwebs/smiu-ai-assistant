# Alembic configuration (DATABASE_DESIGN.md §27).
# The database URL is injected by alembic/env.py from application settings,
# so it is not duplicated here.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[alembic:autogenerate]
# Models are imported in env.py so autogenerate can compare metadata.
