[project]
name = "backend"
version = "0.1.0"
description = "FastAPI REST API for the SMIU AI Assistant platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
exclude = ["alembic"]

# The AI package is a separate mypy project with its own config and strict
# baseline (ai/pyproject.toml). The backend facade only consumes its public
# types, so ai modules are followed silently and never checked under the
# backend's config (mirrors how the AI project skips its own third-party deps).
[[tool.mypy.overrides]]
module = ["ai.*"]
follow_imports = "silent"
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
